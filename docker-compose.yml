# Mergin Maps Community Edition di mergin.dh.unica.it, su dhgeo 90.147.144.148.
# Derivato da deployment/community di MerginMaps/server, come configurato da Faunalia
# (export del 27/10/2026). Differenze: password del DB da .env, una sola porta pubblicata
# e configurabile, file di configurazione nella radice del repository, log a dimensione limitata.
#
# Le immagini restano alla 2025.7.3: lo schema del database corrisponde a questa versione.
# Un aggiornamento si pianifica a parte, con backup e migrazioni (PROSSIMI-PASSI.md).

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

networks:
  merginmaps:
    name: mergin

services:
  db:
    image: postgres:14
    container_name: merginmaps-db
    restart: always
    networks:
      - merginmaps
    environment:
      - POSTGRES_DB=mergin
      - POSTGRES_USER=postgres
      # usata solo per inizializzare una cartella dati vuota; deve coincidere con DB_PASSWORD di .prod.env
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD in .env}
    volumes:
      - ./mergin_db:/var/lib/postgresql/data
    logging: *logging

  redis:
    image: redis:6.2.17
    container_name: merginmaps-redis
    restart: always
    networks:
      - merginmaps
    logging: *logging

  server:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    container_name: merginmaps-server
    restart: always
    user: 901:999
    volumes:
      - ./projects:/data
      - ./diagnostic_logs:/diagnostic_logs
    env_file:
      - .prod.env
      - otel.env
    environment:
      # just to distinguish telemetry source (if enabled), does not affect functionality
      - OTEL_SERVICE_NAME=backend
    depends_on:
      - db
      - redis
    command: [ "gunicorn --config config.py application:application" ]
    networks:
      - merginmaps
    logging: *logging

  celery-beat:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    container_name: celery-beat
    restart: always
    env_file:
      - .prod.env
      - otel.env
    environment:
      - GEVENT_WORKER=0
      - NO_MONKEY_PATCH=1
      - OTEL_SERVICE_NAME=celery-beat
    depends_on:
      - redis
      - server
    command: [ "celery -A application.celery beat --loglevel=info" ]
    networks:
      - merginmaps
    logging: *logging

  celery-worker:
    image: lutraconsulting/merginmaps-backend:2025.7.3
    container_name: celery-worker
    restart: always
    user: 901:999
    env_file:
      - .prod.env
      - otel.env
    environment:
      - GEVENT_WORKER=0
      - NO_MONKEY_PATCH=1
      - OTEL_SERVICE_NAME=celery-worker
      - OTEL_MANUAL_CELERY_TRACING=0
    volumes:
      - ./projects:/data
    depends_on:
      - redis
      - server
      - celery-beat
    command: [ "celery -A application.celery worker --loglevel=info" ]
    networks:
      - merginmaps
    logging: *logging

  web:
    image: lutraconsulting/merginmaps-frontend:2025.7.3
    container_name: merginmaps-web
    restart: always
    depends_on:
      - server
    user: 101:999
    networks:
      - merginmaps
    logging: *logging

  proxy:
    image: nginxinc/nginx-unprivileged:1.27
    container_name: merginmaps-proxy
    restart: always
    # run nginx as built-in user but with group mergin-family for files permissions
    user: 101:999
    ports:
      # 127.0.0.1 finché il firewall DOCKER-USER non è attivo, poi l'IP della VM (vedi .env.example).
      # La 8082 dell'originale serviva solo a Grafana, disattivato: non si pubblica.
      - "${MERGIN_PORT:-127.0.0.1:8086}:8080"
    volumes:
      - ./projects:/data  # mergin maps projects data dir to host
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - merginmaps
    logging: *logging
